<meta name="description" content="人とAIが同じトラックを走ったら？ 一定の速さで進む人と、指数関数で加速するAIの違いを、アニメーションで見られます。">
<link rel="canonical" href="https://ai-kakekomi.com/ai-speed/">
<link rel="icon" href="/favicon.ico">
<meta property="og:title" content="AIの進化のスピード | AIかけこみ寺">
<meta property="og:description" content="一定の速さで進む人と、指数関数で加速するAI。その違いをアニメーションで。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ai-kakekomi.com/ai-speed/">
<meta property="og:image" content="https://ai-kakekomi.com/ogp.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Shippori+Mincho+B1:wght@700;800&family=DM+Sans:wght@500;700;800&display=swap">
<style>
  [hidden] { display: none !important; }
  /* 1画面のスライド: 見出し → 周回トラック（中央に周回遅れの数） → 数字と一言 */
  :root {
    /* slides リポのデッキと同じ紙色。テーマに関わらずこの見た目で固定 */
    --bg: #FBF6EA;
    --fg: #1A1A1F;
    --sub: #6B665C;
    --rule: #E3DBC8;
    --track: #F0E9DA;
    --lin: #9A9488;
    --exp: #D9472B;
    --ground: #E5D0A8; --chalk: #FFFDF7; --flag1: #2F6DB5; --flag2: #E8B92F; --flag3: #3E9B5B;
    --skin: #F7DCC4; --hair: #4B3A30; --blush: #F2A28F; --metal: #E4DED2;
    --display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
    --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --mono: "DM Sans", "Zen Kaku Gothic New", sans-serif;
    color-scheme: light;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--display);
    display: flex; flex-direction: column; justify-content: center; gap: clamp(12px, 2.4vh, 28px);
    padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    max-width: 1200px; margin: 0 auto; box-sizing: border-box;
  }
  h1 { margin: 0; font-size: clamp(22px, 4vw, 44px); font-weight: 900; letter-spacing: .02em; text-wrap: balance; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: clamp(14px, 1.6vw, 18px); color: var(--sub); }
  .legend b { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { width: 1.6em; height: 1.6em; }
  .legend .l b { color: var(--lin); }
  .legend .e b { color: var(--exp); }
  canvas { width: 100%; height: clamp(240px, 52vh, 520px); display: block; cursor: pointer; touch-action: manipulation; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; }
  .stat span { display: block; font-size: clamp(12px, 1.3vw, 15px); color: var(--sub); }
  .stat output { font-family: var(--mono); font-weight: 600; font-size: clamp(20px, 3.2vw, 38px); font-variant-numeric: tabular-nums; }
  .stat.l output { color: var(--lin); }
  .stat.e output { color: var(--exp); }
  .bottom { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
  #note { font-size: clamp(16px, 2vw, 24px); font-weight: 700; min-height: 1.4em; margin: 0; min-width: 0; flex: 1 1 20em; }
  .stage { position: relative; }
  .end {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: .5em;
    padding: 0 6%; background: color-mix(in srgb, var(--bg) 92%, transparent);
    font-size: clamp(16px, 2.6vw, 30px); font-weight: 700; cursor: pointer;
  }
  .end p { margin: 0; opacity: 0; transform: translateY(6px); animation: rise .6s ease-out forwards; }
  .end p:nth-child(2) { animation-delay: 1.4s; }
  .end p:nth-child(3) { animation-delay: 2.8s; }
  .end p:nth-child(4) { animation-delay: 4.2s; }
  .end p:nth-child(5) { animation-delay: 5.6s; }
  .end p:nth-child(6) { animation-delay: 7.0s; }
  .end .key { color: var(--exp); font-family: var(--mincho); font-weight: 800; font-size: 1.2em; }
  .end .sign { font-size: .6em; color: var(--sub); font-weight: 500; margin-top: .6em; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .end p { animation: none; opacity: 1; transform: none; } }
  .fine { margin: -8px 0 0; font-size: 12px; color: var(--sub); text-align: right; }
  button {
    font: 700 16px var(--display); color: var(--bg); background: var(--fg);
    border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer;
  }
  /* 追い越される瞬間に、イラスト（トラック）だけを一瞬反転させる（ドンと同時） */
  canvas.flip { filter: invert(1); }
  canvas.flip-back { transition: filter .9s ease-in; }
  @media (prefers-reduced-motion: reduce) { canvas.flip { filter: none; } }
  button:focus-visible { outline: 3px solid var(--exp); outline-offset: 3px; }
  button.ghost { color: var(--fg); background: transparent; border: 1.5px solid var(--rule); font-weight: 600; padding: 9px 16px; }
</style>

</div>

<div class="stage">
  <canvas id="cv" aria-label="人とAIが周回トラックを走り、AIが人を周回遅れにしていくアニメーション"></canvas>
  <div id="end" class="end" hidden>
    <p>AIに置いていかれない人は、いません。<br>誰にとっても、他人事ではありません。</p>
    <p>AIが人を追い越す瞬間、社会は揺れます。</p>
    <p>善人も悪人も、AIの力を使います。</p>
    <p>そのあとも、人はAIと生きていく必要があります。</p>

</div>
<p class="fine">速さと周回の数はイメージです。</p>

<div class="stats">
  <div class="stat"><span>経過</span><output id="clock">0.0 秒</output></div>

</div>

        dotc(0, -.6, .09, C.exp);
        ctx.fillStyle = css('--metal'); ctx.beginPath(); ctx.roundRect(-.52, -.34, 1.04, .84, .26); ctx.fill(); ctx.stroke();
        dotc(-.2, .04, .11, C.fg); dotc(.2, .04, .11, C.fg);
        dotc(-.17, .005, .035, C.bg); dotc(.23, .005, .035, C.bg);
        cheek(-.36, .26, .08, .05); cheek(.36, .26, .08, .05);
        smile(.27);
      }
    });
  }

  function draw(s) {
    lastS = s;
    const W = cv.clientWidth, H = cv.clientHeight;
    const C = { bg: css('--bg'), fg: css('--fg'), sub: css('--sub'), track: css('--track'), chalk: css('--chalk'), rule: css('--rule'), lin: css('--lin'), exp: css('--exp'), mono: css('--mono'), disp: css('--display') };
    ctx.clearRect(0, 0, W, H);
    const g = geo(W, H);
    const rIn = g.R - g.lane * 0.6, rOut = g.R + g.lane * 0.6;

    // 校庭の土
    ctx.fillStyle = css('--ground');
    ctx.beginPath(); ctx.roundRect(0, g.top * 0.55, W, H - g.top * 0.55, 20); ctx.fill();

    // 万国旗
    const fl = [C.exp, css('--flag1'), css('--flag2'), css('--flag3'), C.chalk];
    const n = Math.max(8, Math.round(W / 34)), sag = g.top * 0.32, y0 = 6;
    const sy = x => y0 + sag * (1 - Math.pow(2 * x / W - 1, 2));
    ctx.strokeStyle = C.sub; ctx.lineWidth = 1.2;
    ctx.beginPath(); for (let x = 0; x <= W; x += 6) x ? ctx.lineTo(x, sy(x)) : ctx.moveTo(x, sy(x)); ctx.stroke();
    for (let i = 0; i < n; i++) {
      const x = (i + 0.5) * W / n, w = Math.min(22, W / n * 0.7), h = w * 1.05;
      ctx.fillStyle = fl[i % fl.length];
      ctx.beginPath(); ctx.moveTo(x - w / 2, sy(x - w / 2)); ctx.lineTo(x + w / 2, sy(x + w / 2)); ctx.lineTo(x, sy(x) + h); ctx.closePath(); ctx.fill();
      if (fl[i % fl.length] === C.chalk) { ctx.strokeStyle = C.rule; ctx.lineWidth = 1; ctx.stroke(); }
    }

    // 石灰の白線: 内側・レースの境・外側
    ctx.lineCap = 'round'; ctx.strokeStyle = C.chalk; ctx.lineWidth = 3;
    for (const r of [g.R - g.lane * 1.2, g.R, g.R + g.lane * 1.2]) { lanePath(g, r, 0, 1); ctx.closePath(); ctx.stroke(); }

    // スタート／ゴールの線
    ctx.lineWidth = 5; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(g.cx, g.cy + g.R - g.lane * 1.2); ctx.lineTo(g.cx, g.cy + g.R + g.lane * 1.2); ctx.stroke();
    ctx.lineCap = 'round';

    const lv = linV(s), ev = expV(s);
    const dot = Math.max(13, g.lane * 0.95);

    // 走者: 内側が人、外側がAI。速いほど尾を長く引く（1周を超える速さでは輪になる）
    for (const [r, v, sp, col, icon] of [[rIn, lv, 0.1, C.lin, 'human'], [rOut, ev, expSpeed(s), C.exp, 'bot']]) {
      const tail = Math.min(0.999, sp * 0.35);
      if (tail > 0.004 && s > 0) {
        const steps = 14;
        for (let i = 0; i < steps; i++) {
          ctx.globalAlpha = 0.08 + 0.6 * (i + 1) / steps;
          ctx.strokeStyle = col; ctx.lineWidth = dot * 0.7;
          lanePath(g, r, v - tail * (1 - i / steps), v - tail * (1 - (i + 1) / steps)); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      const [x, y] = pt(g, r, v);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(x, y, dot, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.bg;
      ctx.beginPath(); ctx.arc(x, y, dot * 0.82, 0, Math.PI * 2); ctx.fill();
      face(icon, x, y, dot, C);
    }

    // 中央: 周回遅れの数
    const behind = Math.max(0, Math.floor(ev + 1e-9) - Math.floor(lv + 1e-9));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const big = Math.min(g.R * 0.75, 96);
    const small = Math.max(13, big * 0.24);
    if (behind > 0) {
      ctx.fillStyle = C.sub; ctx.font = `700 ${small}px ${C.disp}`;
      ctx.fillText('人は、周回遅れ', g.cx, g.cy - big * 0.62);
      ctx.fillStyle = C.exp; ctx.font = `600 ${big}px ${C.mono}`;
      ctx.fillText(behind.toLocaleString('ja-JP'), g.cx, g.cy + big * 0.12);
      ctx.fillStyle = C.sub; ctx.font = `700 ${small}px ${C.disp}`;
      ctx.fillText('周', g.cx, g.cy + big * 0.78);
    } else {
      ctx.fillStyle = C.sub; ctx.font = `700 ${Math.max(14, big * 0.28)}px ${C.disp}`;
      ctx.fillStyle = s >= 10 ? C.exp : C.sub;
      ctx.fillText(s === 0 ? 'スタート' : s >= 10 ? '追い越される瞬間' : 'どちらが先に1周するでしょう？', g.cx, g.cy);
    }

    out.clock.textContent = (s * SEC / 1000).toFixed(1) + ' 秒';
    out.vl.textContent = lv.toFixed(2) + ' 周';
    out.ve.textContent = (ev < 10 ? ev.toFixed(2) : Math.floor(ev).toLocaleString('ja-JP')) + ' 周';
  }

  function say(s, holding) {
    let m;
    if (holding) m = '追い越される瞬間です。社会がいちばん揺れるのは、ここです。';
    else if (s < 5) m = '人が先を行きます。AIはまだ、ほとんど動きません。';
    else if (s < 9) m = '半分の時間が過ぎても、AIは1周の2%です。';
    else if (s < 10) m = '最後の1.5秒で、一気に追いつきます。';
    else if (s < 20) m = 'ここから先は、10周遅れも100周遅れも変わりません。';
    else m = '';
    if (note.textContent !== m) note.textContent = m;
  }

  function tick(now) {
    if (t0 === null) t0 = now;
    const e = now - t0;
    let s, holding = false;
    const a = S1 * SEC;
    if (e < a) s = e / SEC;
    else if (e < a + SLOW) { s = S1 + (S2 - S1) * (e - a) / SLOW; holding = true; }
    else s = Math.min(20, S2 + (e - a - SLOW) / SEC);
    draw(s); say(s, holding); sound(s, holding);
    if (s < 20) raf = requestAnimationFrame(tick);
    else { btn.textContent = 'もう一度'; endCard.hidden = false; SFX.finale(); }
  }

  // イラストの反転: 0.7 秒反転したまま止めて、ゆっくり戻す
  let flipT = null;
  function flip() {
    clearTimeout(flipT);
    cv.className = 'flip';
    flipT = setTimeout(() => { cv.className = 'flip-back'; }, 700);
  }

  function sound(s, slow) {
    if (slow) {
      if (!slowed) { slowed = true; SFX.slow(true); }
      if (s >= 10 && !held) { held = true; SFX.moment(); flip(); }  // 並んだ瞬間にドンと画面の反転
      return;
    }
    if (s < 10) SFX.ai(s, expSpeed(s));
    else if (!after) { after = true; SFX.slow(false); SFX.after(); }
  }

  function play() {
    cancelAnimationFrame(raf); t0 = null; endCard.hidden = true; clearTimeout(flipT); cv.className = '';
    btn.textContent = '走っています…';
    held = false; after = false; slowed = false;
    const ready = SFX.init();
    // 音の読み込みを待ってから号砲と同時に走り出す（初回だけ少し待つ）
    const my = ++runId;
    Promise.resolve(ready).then(() => { if (my !== runId) return; cancelAnimationFrame(raf); SFX.start(); raf = requestAnimationFrame(tick); });
  }
  let runId = 0;

  const snd = document.getElementById('snd');
  const sndLabel = () => { snd.textContent = SFX.on ? '音あり' : '音なし'; snd.setAttribute('aria-pressed', SFX.on); };
  snd.addEventListener('click', () => { SFX.on = !SFX.on; sndLabel(); if (SFX.on) SFX.init(); });
  sndLabel();

  btn.addEventListener('click', play);
  cv.addEventListener('click', play);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); play(); }
  });
  window.addEventListener('resize', () => { size(); draw(lastS); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => draw(lastS));
  new MutationObserver(() => draw(lastS)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  size(); draw(0);
  document.fonts && document.fonts.ready.then(() => draw(lastS));
</script>

<script type="module" src="/js/nice-wrap.js"></script>
</body></html>
